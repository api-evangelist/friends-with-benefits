name: Friends with Benefits
description: >-
  Friends with Benefits (FWB) is a token-gated social DAO and cultural community
  at the intersection of web3, art, music, and technology. Membership is gated by
  holding the $FWB ERC-20 token, which unlocks access to the community's Discord,
  local city chapters, IRL events, and editorial and creative programming. Backed
  by a16z crypto, FWB is one of the most cited examples of a social DAO. It is a
  community organization rather than an API provider: as of this profile it exposes
  no public developer API, OpenAPI definition, or developer portal, and its primary
  web presence (fwb.help) is a membership site. This entry was surfaced as an a16z
  portfolio company and added to the API Evangelist network as an enrichment lead.
